[package]
name = "partio"
version = "0.1.0"
description = "Partio Inventory: open-source inventory for electronic parts, storage locations and BOMs"
authors = ["Partio Inventory contributors"]
license = "MIT"
repository = "https://github.com/ImbriusTechnology/partio"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "partio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
# API keys live in the system's secure storage: Keychain (macOS), Credential Manager (Windows),
# Secret Service (Linux). Without these features keyring silently uses an in-memory mock store.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
